  </g>
  <!-- VS -->
  <circle cx="60" cy="98" r="13" fill="#fff"/>
  <text x="60" y="103" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="13" text-anchor="middle" fill="#e3191f">VS</text>
